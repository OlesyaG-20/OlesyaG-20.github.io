<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Body by Olesya | Back soon</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f6f1ea;      /* change to your background colour */
    --ink: #1c1a18;     /* main text */
    --accent: #b08d57;  /* gold accent */
    --muted: #6f675e;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  main { max-width: 480px; }
  .brand {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .line { width: 48px; height: 1px; background: var(--accent); margin: 28px auto; }
  h1 { font-size: clamp(32px, 8vw, 46px); font-weight: 400; line-height: 1.15; }
  p {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    margin-top: 20px;
  }
  .sign { font-style: italic; font-family: Georgia, serif; color: var(--ink); margin-top: 32px; }
</style>
</head>
<body>
  <main>
    <div class="brand">Body by Olesya</div>
    <div class="line"></div>
    <h1>Taking a short pause.</h1>
    <p>The website is being refreshed and will be back very soon. Thank you for your patience.</p>
    <p class="sign">Olesya</p>
  </main>
</body>
</html>
